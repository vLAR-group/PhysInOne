# Configuration for Wan2.2 Finetuning
model_key: "stabilityai/stable-video-diffusion-img2vid-xt"
negative_prompt: '色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走'
height: 576
width: 576
num_frame: 25
main_frame_index: 0
fps: 8
image_resolution: [224, 224]

# Final_layer_tuning
num_to_tune: 2 # about 379MB
batch_size: 4 # max 4
learning_rate: 0.0001 # 0.0001
max_grad_norm: 1 # 0.01 will occur Nan
scale_lr: false
lr_scheduler: "constant_with_warmup"
lr_warmup_steps: 100
lr_num_cycles: 1
lr_power: 1.0
use_8bit_adam: false
dataloader_num_workers: 1
adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 0.01
adam_epsilon: 1e-08
mixed_precision: null
gradient_checkpointing: True
use_gradient_checkpointing_offload: true
set_grads_to_none: true
gradient_accumulation_steps: 16
# "to_q", "to_k", "to_v", "to_out.0",  # Attention layers (optional)
#         "ff.net.0.proj",      # First linear in FFN
#         "ff.net.2",           # Second linear in FFN

# Accelerate
specific_object: -1
cond_lighting_index: 0
revision: null
output_dir: "models"
save_dir: "./"
seed: 42
resume_from_checkpoint: null
num_train_epochs: 10
max_train_steps: 1000 # 80000
guidance_scale: 3.0
conditioning_dropout_prob: 0.1
checkpointing_steps: 200
checkpoints_total_limit: 2
logging_dir: "logs"
allow_tf32: false
report_to: "wandb"
tracker_project_name: "PhysInOne-SVDXL"
push_to_hub: false
hub_token: null
hub_model_id: null


# Validation
validation_steps: 200 # When to go to log_validation

