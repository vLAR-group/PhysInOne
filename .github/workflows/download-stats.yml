name: Refresh download statistics

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_download_stats.py
      - scripts/test_download_stats.py
      - .github/workflows/download-stats.yml

permissions:
  contents: write

concurrency:
  group: download-statistics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test aggregation and input validation
        run: python -m unittest discover -s scripts -p test_download_stats.py
      - name: Fetch complete public counters
        run: python scripts/update_download_stats.py --output-dir "$RUNNER_TEMP/download-stats-output"
      - name: Publish snapshot on the statistics branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin download-stats
          git worktree add --detach "$RUNNER_TEMP/download-stats-publish" FETCH_HEAD
          cp "$RUNNER_TEMP/download-stats-output/"*.json "$RUNNER_TEMP/download-stats-publish/"
          cd "$RUNNER_TEMP/download-stats-publish"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- stats.json downloads.json updated.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh public Hugging Face download counters"
          git push origin HEAD:download-stats
